<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEGO Eurobox rack</title>
<!-- FAVICON -->
<!-- LICENCES -->
<style>/* CSS */</style>
</head>
<body>
<canvas id="view"></canvas>
<header>
  <h1>LEGO Eurobox rack</h1>
  <p id="info">Loading the model…</p>
</header>
<nav id="views" aria-label="View">
  <button class="wa-neutral wa-outlined wa-size-s" data-view="reset">Reset</button>
  <button id="colours" class="wa-neutral wa-outlined wa-size-s" aria-pressed="false" aria-controls="clips">Colours</button>
</nav>
<aside id="clips" aria-label="ColorClips" hidden>
  <h2>ColorClips</h2>
  <div id="levels"></div>
  <p id="step"></p>
  <ul id="order" aria-label="Packs to order"></ul>
</aside>
<div id="label" hidden></div>
<script>/* JS */</script>
</body>
</html>
